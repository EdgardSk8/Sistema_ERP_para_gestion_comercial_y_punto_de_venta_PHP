<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gráfica con 10 datos en Chart.js</title>
    <!-- Cargar Chart.js desde CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div style="width: 80%; margin: auto;">
        <canvas id="miGrafica"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('miGrafica').getContext('2d');

        // Definimos las 10 etiquetas (eje X) y los 10 valores (eje Y)
        const misEtiquetas = ['Dato 1', 'Dato 2', 'Dato 3', 'Dato 4', 'Dato 5', 'Dato 6', 'Dato 7', 'Dato 8', 'Dato 9', 'Dato 10'];
        const misValores = [12, 19, 3, 5, 2, 3, 15, 22, 8, 14];

        const miGrafica = new Chart(ctx, {
            type: 'bar', // Cambia a 'line' si prefieres líneas
            data: {
                labels: misEtiquetas,
                datasets: [{
                    label: 'Mi conjunto de 10 datos',
                    data: misValores,
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

</body>
</html>
